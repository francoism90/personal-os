# Desktop kernel tuning, shipped by the image (files/system).
# uCore replaces this file with the server copy in files/core; keep the section order of both in sync.
# Anything not set here keeps the kernel/Fedora default.
#
# Local tweaks: don't edit this file (local edits stop it from receiving image updates). Add a file
# that sorts after it instead, e.g. /etc/sysctl.d/99-zz-local.conf. See sysctl.d(5).

# === Memory ===

# zram is the only swap and is far cheaper than re-reading evicted files from disk,
# so swap to it eagerly and fetch single pages (no readahead).
# https://wiki.archlinux.org/title/Zram#Optimizing_swap_on_zram
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# === Filesystem ===

# IDEs, file sync and Flatpaks run out of the stock inotify watch/instance limits.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# === Network ===

# BBR congestion control with the fq qdisc it is designed for.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Recover from paths that silently drop large packets (Tailscale/VPNs, some hotspots).
net.ipv4.tcp_mtu_probing = 1
# Keep long-lived connections (Syncthing, SSH) at full speed after they go idle.
net.ipv4.tcp_slow_start_after_idle = 0

# Enough for QUIC (Syncthing, browsers) to get the UDP buffers it asks for; TCP autotuning stays default.
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000

# === Security ===

# Only a parent process (or root) may ptrace or read another process's memory.
# Side effect: attaching gdb/strace to a running process (-p) needs sudo.
kernel.yama.ptrace_scope = 1
# Hide kernel pointers from unprivileged users.
kernel.kptr_restrict = 1

# Not a router: ignore ICMP redirects (traffic rerouting on hostile networks) and don't send them.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# rp_filter is left at Fedora's loose mode on purpose: strict mode breaks Tailscale.

# === Kernel ===

# No hard-lockup detection on desktops; saves a little power and a permanently running perf counter.
kernel.nmi_watchdog = 0
