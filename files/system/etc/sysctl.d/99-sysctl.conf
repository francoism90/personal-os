# sysctl settings are defined through files in
# /usr/lib/sysctl.d/, /run/sysctl.d/, and /etc/sysctl.d/.
#
# Vendors settings live in /usr/lib/sysctl.d/.
# To override a whole file, create a new file with the same in
# /etc/sysctl.d/ and put new settings there. To override
# only specific settings, add a file with a lexically later
# name in /etc/sysctl.d/ and put new settings there.
#
# For more information, see sysctl.conf(5) and sysctl.d(5).
#
# Desktop defaults. uCore replaces this file with the server-tuned
# files/core/etc/sysctl.d/99-sysctl.conf; anything not set here keeps the kernel/Fedora default.

# --- Filesystem & Container Instance Limits ---
# IDEs, file sync and flatpaks run out of the stock watch/instance limits.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# --- TCP Congestion Control ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# --- Socket Memory Buffers ---
# Enough for QUIC (Syncthing, browsers) to get the UDP buffers it asks for; TCP autotuning stays default.
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
