# Replaces Fedora's zram-generator-defaults config (desktops) and enables zram on uCore,
# where Fedora CoreOS ships zram-generator without any config.
# Lives under /usr/lib so a host can still override it with /etc/systemd/zram-generator.conf.
[zram0]
# Uncompressed device size: all of RAM, capped at 8 GiB (Fedora's default).
zram-size = min(ram, 8192)
# Better ratio than the kernel's lzo-rle default, at little CPU cost.
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
