# zram swap for every image. A drop-in rather than the main zram-generator.conf, because only one main
# file is read and an /etc copy wins over /usr/lib: uCore ships an /etc/systemd/zram-generator.conf with
# bare defaults (min(ram / 2, 4096), lzo-rle) that would otherwise replace this. Drop-ins apply on top of
# whichever main file wins. Override per host with /etc/systemd/zram-generator.conf.d/90-personal-os.conf.
[zram0]
# Uncompressed device size: all of RAM, capped at 8 GiB (Fedora's default).
zram-size = min(ram, 8192)
# Better ratio than the kernel's lzo-rle default, at little CPU cost.
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
