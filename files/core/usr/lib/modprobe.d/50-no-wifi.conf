# The server is wired-only, so keep the Intel Wi-Fi driver from loading at all: the card then stays
# unbound (no interface, no firmware load). `install ... /bin/false` also stops loads pulled in by
# other modules or an explicit modprobe, which `blacklist` alone doesn't. Remove this file to use Wi-Fi.
blacklist iwlwifi
install iwlwifi /bin/false
