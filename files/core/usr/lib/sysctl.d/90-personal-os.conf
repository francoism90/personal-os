# Server (uCore) kernel tuning, shipped by the image (files/core).
# Replaces the desktop copy from files/system, since core.yml runs after common.yml;
# keep the section order of both in sync. Anything not set here keeps the kernel/Fedora default.
#
# Lives in /usr/lib so it always follows the image; a stale or deleted /etc copy can't shadow it.
# Local tweaks: add /etc/sysctl.d/99-local.conf (sorts after this file, so it wins per key), or
# /etc/sysctl.d/90-personal-os.conf to replace this file entirely. See sysctl.d(5).

# === Memory ===

# zram is the only swap and is far cheaper than re-reading evicted files from disk,
# so swap to it eagerly and fetch single pages (no readahead). The ZFS ARC is not page cache
# and shrinks on its own under pressure, so swappiness doesn't affect it.
# https://wiki.archlinux.org/title/Zram#Optimizing_swap_on_zram
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# Cap dirty page cache at 1 GiB (background flush from 256 MiB) instead of 20% of RAM (~5 GiB),
# so big copies to the USB disks don't stall for a long time.
# ZFS has its own write throttle (zfs_dirty_data_max), so the pool isn't affected.
vm.dirty_background_bytes = 268435456
vm.dirty_bytes = 1073741824

# Always grant allocations instead of refusing large ones up front; Redis/Valkey-style containers
# require it. The trade-off: memory exhaustion ends in the OOM killer rather than a failed malloc.
vm.overcommit_memory = 1

# === Filesystem ===

# Many containers each watching their config/data dirs run out of the stock inotify limits.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192

# === Network ===

# BBR congestion control with the fq qdisc it is designed for.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Recover from paths that silently drop large packets (Tailscale/VPNs).
net.ipv4.tcp_mtu_probing = 1
# TCP Fast Open for both outgoing (1) and incoming (2) connections.
net.ipv4.tcp_fastopen = 3

# Deeper queues for bursts of new connections and for 2.5 Gbit/s traffic arriving faster than
# the kernel can process it. (net.core.somaxconn already defaults to 4096 since kernel 5.4.)
net.ipv4.tcp_max_syn_backlog = 4096
net.core.netdev_max_backlog = 10000

# Let TCP autotuning grow windows to 16 MiB, enough to fill 2.5 Gbit/s LAN links.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Room for the connection-tracking table of many containers and torrent peers.
net.netfilter.nf_conntrack_max = 1048576

# More ephemeral ports for outgoing connections (default 32768-60999).
net.ipv4.ip_local_port_range = 30000 65535
# Let rootless containers (e.g. a reverse proxy) bind 80/443; any local user can, too.
net.ipv4.ip_unprivileged_port_start = 80

# === Security ===

# Only a parent process (or root) may ptrace or read another process's memory.
# Side effect: attaching gdb/strace to a running process (-p) needs sudo.
kernel.yama.ptrace_scope = 1
# Hide kernel pointers from unprivileged users.
kernel.kptr_restrict = 1

# Not a router: ignore ICMP redirects (traffic rerouting on hostile networks) and don't send them.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# rp_filter is left at Fedora's loose mode on purpose: strict mode breaks Tailscale.
