# Bluetooth LE Audio (BAP/LC3): BlueZ's BAP plugin is still marked experimental (-E), and it needs the
# kernel's ISO socket feature (-K with its UUID). Same as Experimental/KernelExperimental in main.conf.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --experimental --kernel=6fbaf188-05e0-496a-9885-d6ddfdb4e03e
