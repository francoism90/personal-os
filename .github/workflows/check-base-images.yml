name: check-base-images
# Rebuild soon after a base image changes, instead of waiting for the daily build in build.yml.
# Aurora's `testing` stream (Fedora 45) is published on manual dispatches at irregular times, so no fixed
# cron lines up with it. Each image we publish records the digest it was built from in the
# `org.opencontainers.image.base.digest` label; when a base's current digest differs, build.yml is dispatched.
on:
  schedule:
    - cron: "23 */2 * * *" # every 2 hours
  workflow_dispatch:

permissions:
  contents: read
  actions: write # to dispatch build.yml and read its runs

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Compare base image digests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch build.yml if a base image changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          changed=0
          newest_base=""

          # Only the recipes build.yml actually builds (commented-out matrix entries are skipped by yq).
          for recipe in $(yq '.jobs.bluebuild.strategy.matrix.recipe[]' .github/workflows/build.yml); do
            file="recipes/${recipe}"
            base="$(yq '.base-image' "$file"):$(yq '.image-version' "$file")"
            ours="ghcr.io/${owner}/$(yq '.name' "$file"):latest"

            base_json="$(skopeo inspect --no-tags "docker://${base}")"
            upstream="$(jq -r '.Digest' <<< "$base_json")"
            created="$(date -u -d "$(jq -r '.Created' <<< "$base_json")" +%Y-%m-%dT%H:%M:%SZ)"
            recorded="$(skopeo inspect --no-tags "docker://${ours}" 2>/dev/null \
              | jq -r '.Labels["org.opencontainers.image.base.digest"] // "none"' || echo none)"

            echo "${recipe}: ${base} is ${upstream} (published ${created}); ${ours} was built from ${recorded}"
            if [ "$upstream" != "$recorded" ]; then
              changed=1
              if [[ "$created" > "$newest_base" ]]; then newest_base="$created"; fi
            fi
          done

          if [ "$changed" -eq 0 ]; then
            echo "All images are up to date with their base."
            exit 0
          fi

          last="$(gh run list --workflow build.yml --branch main --limit 1 --json status,conclusion,createdAt \
            --jq '.[0] | "\(.status) \(.conclusion) \(.createdAt)"')"
          read -r status conclusion started <<< "${last:-none none 1970-01-01T00:00:00Z}"

          if [ "$status" != "completed" ]; then
            echo "A build is already ${status}; not dispatching another one."
            exit 0
          fi
          # Don't retry every 2 hours against a base the last build already failed on; the next base
          # update (or the daily build / a push) tries again.
          if [ "$conclusion" = "failure" ] && [[ "$started" > "$newest_base" ]]; then
            echo "The last build (${started}) already failed with this base (published ${newest_base}); skipping."
            exit 0
          fi

          echo "Base image changed (published ${newest_base}); dispatching build.yml."
          gh workflow run build.yml --ref main
