modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # Install fish
  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - fish
        - fastfetch
        - starship

  # Terra repo (Fyra Labs) - https://terrapkg.com/
  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - terra-release
        - firacode-nerd-fonts

  # Install common packages
  - type: dnf
    install:
      packages:
        - btrfsmaintenance
        - hdparm
        - lm_sensors
        - rclone
        - rsync

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
