modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # Packages neither base ships. Aurora and uCore both already have lm_sensors, rclone and tmux;
  # the rest of the old common list now lives in core.yml (missing on uCore) or desktop.yml (missing on Aurora).
  - type: dnf
    install:
      packages:
        - btrfsmaintenance
        - rsync
        - gh

  # Install starship
  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - starship

  # Periodic btrfs maintenance, configured via files/system/etc/sysconfig/btrfsmaintenance,
  # and podman auto-updates for both system and user (rootless) containers.
  - type: systemd
    system:
      enabled:
        - btrfs-balance.timer
        - btrfs-scrub.timer
        - fstrim.timer
        - podman-auto-update.timer
    user:
      enabled:
        - podman-auto-update.timer
        - podman.socket

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
