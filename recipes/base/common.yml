modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # Install fish
  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - fish
        - fastfetch
        - starship

  # Install common packages
  - type: dnf
    install:
      packages:
        - btrfsmaintenance
        - hdparm
        - htop
        - lm_sensors
        - rclone
        - rsync
        - tmux

  # Periodic btrfs maintenance, configured via files/system/etc/sysconfig/btrfsmaintenance,
  # and podman auto-updates for both system and user (rootless) containers.
  - type: systemd
    system:
      enabled:
        - btrfs-balance.timer
        - btrfs-scrub.timer
        - fstrim.timer
        - podman-auto-update.timer
    user:
      enabled:
        - podman-auto-update.timer
        - podman.socket

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
