modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # Packages neither base ships. Aurora and uCore both already have lm_sensors, rclone and tmux; the rest
  # lives in the image's own fragment: core.yml (fish, fastfetch, htop, rsync, gh, starship).
  # (Aurora gets rsync from its Fedora KDE base.)
  # On Aurora, get gh and starship from Homebrew: `brew install gh starship`.
  - type: dnf
    install:
      packages:
        - btrfsmaintenance

  # Periodic btrfs maintenance, configured via files/system/etc/sysconfig/btrfsmaintenance,
  # and podman auto-updates for both system and user (rootless) containers.
  - type: systemd
    system:
      enabled:
        - btrfs-balance.timer
        - btrfs-scrub.timer
        - fstrim.timer
        - podman-auto-update.timer
    user:
      enabled:
        - podman-auto-update.timer
        - podman.socket

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
