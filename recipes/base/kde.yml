modules:
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          title: Flathub (system)
        install:
          - io.github.DenysMb.Kontainer
          - org.fkoehler.KTailctl
          - org.gtk.Gtk3theme.Breeze
          - org.kde.elisa
          - org.kde.falkon
          - org.kde.filelight
          - org.kde.gwenview
          - org.kde.haruna
          - org.kde.kamoso
          - org.kde.kate
          - org.kde.kcalc
          - org.kde.kclock
          - org.kde.kcolorchooser
          - org.kde.kdf
          - org.kde.kdiff3
          - org.kde.kfind
          - org.kde.kolourpaint
          - org.kde.krita
          - org.kde.kweather
          - org.kde.kwrite
          - org.kde.okular
          - org.kde.optiimage

      # Kwi nightly (GPG-signed remote) - https://invent.kde.org/utilities/kwi#nightly-packages
      # Must stay after the Flathub block: its KDE runtime comes from Flathub.
      - scope: system
        notify: false
        repo:
          name: kwi-nightly
          title: Kwi Nightly
          url: https://cdn.kde.org/flatpak/kwi-nightly/kwi-nightly.flatpakrepo
        install:
          - org.kde.kwi

  # KDE-only recipes (enable/remove-flatpak-breeze-theme)
  - type: justfiles
    validate: true
    include:
      - kde
