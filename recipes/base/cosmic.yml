modules:
  - type: dnf
    install:
      packages:
        - cosmic-calculator
        - cosmic-ext-applet-clipboard-manager
        - cosmic-ext-applet-cosmic-nightlight
        - cosmic-ext-applet-emoji-selector
        - cosmic-ext-applet-external-monitor-brightness
        - cosmic-ext-applet-sysinfo
        - cosmic-ext-applet-system-monitor
        - cosmic-ext-applet-weather
        - cosmic-ext-applet-workspace-icons
        - cosmic-ext-camera
        - cosmic-ext-tasks
        - cosmic-ext-tweaks
        - cosmic-monitor
        - examine
        - noctua

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          title: Flathub (system)
        install:
          - org.gnome.Loupe

      - scope: system
        notify: false
        repo:
          name: cosmic
          title: COSMIC
          url: https://apt.pop-os.org/cosmic/cosmic.flatpakrepo
          install:
            - dev.DBrox.CosmicPrivacyIndicator
