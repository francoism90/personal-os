modules:
  # COSMIC-only overlay (files/cosmic/), kept apart from files/system so other images don't get it.
  - type: files
    files:
      - source: cosmic
        destination: /

  # Terra repo (Fyra Labs) - https://terrapkg.com/
  # COSMIC-only: Aurora already ships terra (/usr/share/dnf5/repos.d/terra.repo), and adding it twice fails dnf.
  # Must stay before the dnf install below, which pulls the cosmic-ext packages from it.
  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - terra-release
        - firacode-nerd-fonts # on Aurora: ujust install-fonts (Homebrew cask)

  # Tailscale - https://tailscale.com/kb/1511/install-fedora-2
  # Aurora and uCore already ship it, so only the COSMIC image (Fedora base) needs it.
  - type: dnf
    repos:
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    install:
      packages:
        - tailscale # enable and log in with `blujust setup-tailscale`
    remove:
      packages:
        - firefox # Aurora already drops it; the Fedora COSMIC base doesn't
        - firefox-langpacks

  - type: dnf
    install:
      packages:
        - cosmic-calculator
        - cosmic-ext-applet-clipboard-manager
        - cosmic-ext-applet-cosmic-nightlight
        - cosmic-ext-applet-emoji-selector
        - cosmic-ext-applet-external-monitor-brightness
        - cosmic-ext-applet-sysinfo
        - cosmic-ext-applet-system-monitor
        - cosmic-ext-applet-weather
        - cosmic-ext-applet-workspace-icons
        - cosmic-ext-camera
        - cosmic-ext-tasks
        - cosmic-ext-tweaks
        - examine
        - solaar-udev # Logitech device access for the Solaar Flatpak (Aurora already ships it)
        # CLI tools Aurora/uCore already ship but the Fedora COSMIC base doesn't
        - fastfetch
        - fish
        - htop
        - kde-connect
        - lm_sensors
        - rclone
        - tmux

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          title: Flathub (system)
        install:
          - io.github.diegopvlk.Cine
          - io.github.dvlv.boxbuddyrs
          - org.gnome.Calendar
          - org.gnome.Loupe
          - org.gnome.Papers

      - scope: system
        notify: false
        repo:
          name: cosmic
          title: COSMIC
          url: https://apt.pop-os.org/cosmic/cosmic.flatpakrepo
        install:
          - dev.DBrox.CosmicPrivacyIndicator
