modules:
  # Core-only overlay (files/core/), kept apart from files/system so desktop images don't get it.
  # Loads the ZFS kmod at boot: uCore ships it prebuilt and signed, but does not auto-load it.
  # Units are enabled by vendor symlinks in files/core/usr/lib/systemd/system/*.wants/ instead of a
  # systemd module, so a stale or rebased /etc can't drop them; mask a unit on the host to turn it off:
  # - tuned.service: uCore ships tuned but disables it, and tuned-adm needs the daemon running.
  # - power-profile@{balanced,powersave}.timer: switch tuned profiles by time of day.
  # - zfs-unlock.service: loads all ZFS encryption keys before zfs-mount.service. Its per-pool sibling
  #   zfs-unlock@<pool>.service is shipped but not enabled (no pool names known at build time); to use
  #   it instead, mask zfs-unlock.service and enable the per-pool unit on the host. Don't run both.
  # - tailscaled.service: uCore ships Tailscale but leaves it disabled. Joining the tailnet
  #   (sudo tailscale up ...) stays a one-time host step; its flags persist in tailscaled's state.
  # Tailscale exit node/subnet router support: IP forwarding in usr/lib/sysctl.d/90-personal-os.conf
  # and UDP GRO forwarding on physical NICs via usr/lib/NetworkManager/dispatcher.d/50-tailscale-udp-gro.
  - type: files
    files:
      - source: core
        destination: /

  # Cockpit: no packages here. uCore ships the host-side pages (cockpit-system, -files, -networkmanager,
  # -podman, -selinux) and runs cockpit-ws as the quay.io/cockpit/ws container via its own
  # cockpit.service (auto-updated by podman-auto-update). Installing the cockpit/cockpit-ws RPM would
  # overwrite that unit; cockpit-ostree doesn't understand container-native/bootc deployments
  # (ublue-os/ucore#196).
  # fish, fastfetch, htop and rsync: Aurora ships them, uCore may not. gh, chezmoi (and starship below) are
  # uCore-only; on Aurora they come from Homebrew instead.
  - type: dnf
    install:
      packages:
        - fish
        - fastfetch
        - htop
        - rsync
        - gh
        - chezmoi
        - ethtool # used by the Tailscale UDP GRO dispatcher script; a no-op if uCore already ships it

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - starship

