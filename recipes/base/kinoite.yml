modules:
  # TEMPORARY: the base image ships a partial Plasma 6.8 upgrade (plasma-workspace 6.8.2, kwin 6.7.5).
  # Bring everything in sync from Fedora repos. Kernel/NVIDIA are excluded so the prebuilt kmod keeps matching.
  # Remove once ghcr.io/blue-build/base-images ships a consistent Plasma.
  - type: script
    snippets:
      - dnf -y upgrade --refresh --disablerepo='terra*' --exclude='kernel*' --exclude='*nvidia*' --exclude='*kmod*'

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          title: Flathub (system)
        install:
          - io.github.DenysMb.Kontainer
          - org.fkoehler.KTailctl
          - org.gtk.Gtk3theme.Breeze
          - org.kde.elisa
          - org.kde.falkon
          - org.kde.filelight
          - org.kde.gwenview
          - org.kde.haruna
          - org.kde.kamoso
          - org.kde.kate
          - org.kde.kcalc
          - org.kde.kclock
          - org.kde.kcolorchooser
          - org.kde.kdf
          - org.kde.kdiff3
          - org.kde.keepsecret
          - org.kde.kfind
          - org.kde.kolourpaint
          - org.kde.krita
          - org.kde.kweather
          - org.kde.kwrite
          - org.kde.okular
          - org.kde.optiimage
