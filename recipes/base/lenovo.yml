modules:
  # Public MOK certificate for the legion_laptop module (files/lenovo/usr/share/legion-laptop/).
  # Enroll once per machine for Secure Boot: sudo mokutil --import /usr/share/legion-laptop/legion-mok.der
  - type: files
    files:
      - source: lenovo
        destination: /

  # Lenovo Legion Linux tools (legion_gui, legion_cli, legiond) - https://github.com/johnfanv2/LenovoLegionLinux
  # Built from francoism90/LenovoLegionLinux (upstream spec + debuginfo fix).
  - type: dnf
    repos:
      copr:
        - francoism/lenovolegionlinux
    install:
      packages:
        - python-LenovoLegionLinux

  # The package's %post only prints this step; legiond reads /etc/legion_linux/legiond.ini.
  - type: script
    snippets:
      - cp -r /usr/share/legion_linux /etc/legion_linux

  # legion_laptop kernel module, built from the fork for the image's kernel (DKMS can't build in an
  # image) and signed with the KMOD_SIGNING_KEY secret, passed in by .github/workflows/build.yml.
  - type: script
    secrets:
      - type: env
        name: KMOD_SIGNING_KEY
        mount:
          type: file
          destination: /tmp/kmod-signing.key
    scripts:
      - legion-laptop.sh

  - type: systemd
    system:
      enabled:
        - legiond.service
        - legiond-onresume.service
