modules:
  # Desktop-only overlay (files/desktop/), kept apart from files/system so uCore doesn't get it.
  - type: files
    files:
      - source: desktop
        destination: /

  # Terra repo (Fyra Labs) - https://terrapkg.com/
  # Must stay before the recipe's desktop fragment (e.g. cosmic.yml), which installs packages from it.
  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - terra-release
        - firacode-nerd-fonts

  # Tailscale - https://tailscale.com/kb/1511/install-fedora-2
  # (uCore already ships it, so this lives here rather than in common.yml.)
  - type: dnf
    repos:
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    install:
      packages:
        - tailscale # log in with `blujust setup-tailscale`

  - type: systemd
    system:
      enabled:
        - tailscaled.service

  - type: dnf
    install:
      skip-unavailable: true
      packages:
        - android-tools
        - firewall-config
        - iwd # disabled by default; switch with `blujust toggle-iwd`
        - kde-connect
        - ntsync-autoload
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          title: Flathub (system)
        install:
          - com.bitwarden.desktop
          - com.github.tchx84.Flatseal
          - com.github.wwmm.easyeffects
          - com.ktechpit.whatsie
          - com.obsproject.Studio
          - com.spotify.Client
          - com.usebottles.bottles
          - com.valvesoftware.Steam
          - com.valvesoftware.Steam.CompatibilityTool.Proton-GE
          - fr.handbrake.ghb
          - io.github.martchus.syncthingtray
          - io.github.mfat.sshpilot
          - io.github.pwr_solaar.solaar
          - md.obsidian.Obsidian
          - org.bleachbit.BleachBit
          - org.fkoehler.KTailctl

      # Custom builds (GPG-signed remote), sources at https://github.com/francoism90/flatpaks.
      # Must stay after the Flathub block: the runtimes these apps need come from Flathub.
      - scope: system
        notify: false
        repo:
          name: flatpaks
          title: francoism90 Flatpaks
          url: https://francoism90.github.io/flatpaks/index.flatpakrepo
        install:
          - com.visualstudio.code
          - org.freedesktop.Sdk.Extension.podman

      # FlatPark (GPG-signed remote): repackaged vendor builds, e.g. Claude Desktop from Anthropic's .deb.
      # Must stay after the Flathub block: the runtimes these apps need come from Flathub.
      - scope: system
        notify: false
        repo:
          name: flatpark
          title: FlatPark
          url: https://dl.flatpark.org/flatpark.flatpakrepo
        install:
          - com.anthropic.ClaudeDesktop
          - com.brave.Origin

  - type: justfiles
    validate: true
    install: true
    include:
      - common
