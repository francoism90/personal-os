modules:
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        - ntsync-autoload
        - power-profiles-daemon
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - tuned
        - tuned-ppd

  - type: justfiles
    validate: true
    install: true
    include:
      - common
      - desktop
