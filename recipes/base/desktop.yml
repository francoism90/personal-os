modules:
  # Terra repo (Fyra Labs) - https://terrapkg.com/
  # Must stay before the recipe's desktop fragment (e.g. cosmic.yml), which installs packages from it.
  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - terra-release
        - firacode-nerd-fonts

  - type: dnf
    install:
      skip-unavailable: true
      packages:
        - kde-connect
        - ntsync-autoload
    remove:
      packages:
        - firefox
        - firefox-langpacks

  # Kora icon theme - https://github.com/bikass/kora
  # The copr also ships KDE/Qt libs (e.g. kf6-kirigami), so only pull kora from it and drop the repo after.
  - type: dnf
    repos:
      cleanup: true
      copr:
        - hazel-bunny/ricing
    install:
      packages:
        - repo: copr:copr.fedorainfracloud.org:hazel-bunny:ricing
          packages:
            - kora-icon-theme

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          title: Flathub (system)
        install:
          - com.bitwarden.desktop
          - com.brave.Browser
          - com.github.tchx84.Flatseal
          - com.github.wwmm.easyeffects
          - com.ktechpit.whatsie
          - com.obsproject.Studio
          - com.rafaelmardojai.Blanket
          - com.usebottles.bottles
          - com.valvesoftware.Steam
          - com.valvesoftware.Steam.CompatibilityTool.Proton-GE
          - fr.handbrake.ghb
          - io.github.dvlv.boxbuddyrs
          - io.github.martchus.syncthingtray
          - io.github.pwr_solaar.solaar
          - md.obsidian.Obsidian
          - org.bleachbit.BleachBit
          - org.fkoehler.KTailctl

      # Custom builds (GPG-signed remote), sources at https://github.com/francoism90/flatpaks.
      # Must stay after the Flathub block: the runtimes these apps need come from Flathub.
      - scope: system
        notify: false
        repo:
          name: flatpaks
          title: francoism90 Flatpaks
          url: https://francoism90.github.io/flatpaks/index.flatpakrepo
        install:
          - ai.claude.desktop
          - com.visualstudio.code
          - org.freedesktop.Sdk.Extension.podman

  # Kernel arguments (written to /usr/lib/bootc/kargs.d/)
  - type: kargs
    kargs:
      - amdgpu.dcdebugmask=0x10 # disable Panel Self Refresh (PSR) on AMD GPUs, avoids flicker/freezes on some eDP panels

  - type: justfiles
    validate: true
    install: true
    include:
      - common
