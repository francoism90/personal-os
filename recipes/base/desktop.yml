modules:
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        - kde-connect
        - ntsync-autoload
    remove:
      packages:
        - firefox
        - firefox-langpacks

  # Kora icon theme - https://github.com/bikass/kora
  # The copr also ships KDE/Qt libs (e.g. kf6-kirigami), so only pull kora from it and drop the repo after.
  - type: dnf
    repos:
      cleanup: true
      copr:
        - hazel-bunny/ricing
    install:
      packages:
        - repo: copr:copr.fedorainfracloud.org:hazel-bunny:ricing
          packages:
            - kora-icon-theme

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          title: Flathub (system)
        install:
          - com.bitwarden.desktop
          - com.brave.Browser
          - com.github.tchx84.Flatseal
          - com.github.wwmm.easyeffects
          - com.obsproject.Studio
          - com.usebottles.bottles
          - com.valvesoftware.Steam
          - com.valvesoftware.Steam.CompatibilityTool.Proton-GE
          - com.visualstudio.code
          - io.github.dvlv.boxbuddyrs
          - io.github.martchus.syncthingtray
          - io.github.pwr_solaar.solaar
          - md.obsidian.Obsidian
          - org.bleachbit.BleachBit
          - org.fkoehler.KTailctl

  # Kernel arguments (written to /usr/lib/bootc/kargs.d/)
  - type: kargs
    kargs:
      - amdgpu.dcdebugmask=0x10 # disable Panel Self Refresh (PSR) on AMD GPUs, avoids flicker/freezes on some eDP panels

  - type: justfiles
    validate: true
    install: true
    include:
      - common
